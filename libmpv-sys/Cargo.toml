[package]
name = "libmpv-sys"
version = "0.1.0"
edition = "2024"
description = "Raw FFI bindings for libmpv"

[build-dependencies]
bindgen = { version = "0.72", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }

[features]
generate-bindings = ["bindgen", "reqwest"]
