[package]
name = "libmpv-wrapper"
version = "0.1.1"
edition = "2024"
description = "Wrapper for libmpv"
license = "LGPL-2.1"

[lib]
name = "mpv_wrapper"
crate-type = ["cdylib"]

[dependencies]
libmpv-sys = { path = "./libmpv-sys", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
scopeguard = "1"
indexmap = { version = "2", features = ["serde"] }
libloading = "0.8"

[build-dependencies]
cbindgen = { version = "0.29", optional = true }
bindgen = { version = "0.72", optional = true }

[package.metadata.cargo-post.dependencies]
zip = "6"

[features]
default = [
  "generate-header",
  # "generate-bindings",
  # "generate-sys-bindings",
]
generate-header = ["dep:cbindgen"]
generate-bindings = ["dep:bindgen"]
generate-sys-bindings = ["libmpv-sys/generate-bindings"]

[profile.release]
lto = true
codegen-units = 1
