[package]
name = "libmpv-wrapper"
version = "0.1.0"
edition = "2024"
description = "Wrapper for libmpv"
license = "LGPL-2.1"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
libmpv-sys = { path = "./libmpv-sys", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
scopeguard = "1"
indexmap = { version = "2", features = ["serde"] }
libloading = "0.9.0"

[features]
generate-bindings = ["libmpv-sys/generate-bindings"]
